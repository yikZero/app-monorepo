<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src http://127.0.0.1:4737 http://localhost:4737; connect-src http://127.0.0.1:4737 http://localhost:4737; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Rewards</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f4f5f7;
        color: #1b1d21;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      main {
        box-sizing: border-box;
        padding: 16px 20px 0;
        visibility: hidden;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 650;
      }
      .mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: block;
        object-fit: cover;
        background: #073D2B;
      }
      .wallet {
        font-size: 13px;
        color: #6b7280;
        font-variant-numeric: tabular-nums;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .row img {
        width: 40px;
        height: 40px;
        border-radius: 20px;
      }
      .amount {
        font-size: 22px;
        font-weight: 650;
        line-height: 1.2;
      }
      .hint {
        margin-top: 2px;
        font-size: 13px;
        color: #6b7280;
      }
      button {
        display: block;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #00b812;
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        touch-action: manipulation;
      }
      button:disabled {
        opacity: 0.55;
      }
      .error {
        margin-top: 12px;
        color: #b42318;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <div class="brand">
          <img
            id="brand-icon"
            class="mark"
            src="/assets/rewards.png"
            alt=""
            width="28"
            height="28"
            aria-hidden="true"
          />
          <div id="brand-name">Rewards</div>
        </div>
        <div class="wallet" id="wallet-label"></div>
      </div>
      <div class="card">
        <div class="row">
          <img id="token-icon" src="/assets/usdc.png" alt="" width="40" height="40" />
          <div>
            <div class="amount" id="reward-label">USDC</div>
            <div class="hint">Available to claim</div>
          </div>
        </div>
        <button id="claim-button" type="button" disabled>Claim</button>
      </div>
      <p id="error" class="error" hidden></p>
    </main>
    <script>
      (function () {
        var button = document.getElementById('claim-button');
        var errorNode = document.getElementById('error');
        var fixture = null;
        var assetsReady = false;
        var preparedSent = false;
        var pointSent = false;

        function showError(message) {
          document.querySelector('main').style.visibility = 'visible';
          errorNode.hidden = false;
          errorNode.textContent = message;
        }

        function postNative(payload) {
          if (!window.ReactNativeWebView || !window.ReactNativeWebView.postMessage) {
            showError('Native bridge is not available.');
            return;
          }
          window.ReactNativeWebView.postMessage(JSON.stringify(payload));
        }

        function shortenAddress(address) {
          if (!address || address.length < 12) {
            return address || '';
          }
          return address.slice(0, 6) + '...' + address.slice(-4);
        }

        window.ethereum = {
          request: function (payload) {
            postNative({
              type: 'prime-demo-ethereum-request',
              source: location.href,
              method: payload && payload.method,
              params: payload && payload.params,
            });
            return new Promise(function () {});
          },
        };

        function isMeaningfulLayout() {
          return Boolean(button && button.offsetWidth > 0 && button.offsetHeight > 0);
        }

        function measureButton() {
          var rect = button.getBoundingClientRect();
          if (
            !(rect.width > 0 && rect.height > 0) ||
            !isFinite(rect.left) ||
            !isFinite(rect.top)
          ) {
            return null;
          }
          return {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2,
          };
        }

        function tryPrepare() {
          if (!fixture || !assetsReady || !isMeaningfulLayout()) {
            return;
          }
          var localPoint = measureButton();
          if (!preparedSent) {
            preparedSent = true;
            var prepared = {
              type: 'prime-demo-dapp-prepared',
              source: location.href,
              title: document.title,
              url: location.href,
              method: fixture.request.method,
              layout: {
                width: button.offsetWidth,
                height: button.offsetHeight,
              },
            };
            if (localPoint) {
              prepared.localPoint = localPoint;
              pointSent = true;
            }
            postNative(prepared);
            return;
          }
          if (localPoint && !pointSent) {
            pointSent = true;
            postNative({
              type: 'prime-demo-dapp-ready',
              source: location.href,
              title: document.title,
              url: location.href,
              method: fixture.request.method,
              localPoint: localPoint,
            });
          }
        }

        window.__primeDemoTryPrepare = tryPrepare;
        window.addEventListener('resize', tryPrepare);

        button.addEventListener('click', function () {
          if (!fixture) {
            return;
          }
          var typedData = fixture.request.params[1];
          var message =
            typeof typedData === 'string' ? typedData : JSON.stringify(typedData);
          window.ethereum.request({
            method: fixture.request.method,
            params: [fixture.request.params[0], message],
          });
        });

        fetch('/fixture.json', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('Fixture request failed');
            }
            return response.json();
          })
          .then(function (value) {
            fixture = value;
            if (!fixture || !fixture.request || !fixture.dapp) {
              throw new Error('Fixture is missing dApp request data');
            }
            var dapp = fixture.dapp;
            var rewardAmount = dapp.rewardAmount || '';
            var rewardSymbol = dapp.rewardSymbol || 'USDC';
            document.getElementById('brand-name').textContent = dapp.name;
            document.title = dapp.name;
            document.getElementById('wallet-label').textContent = shortenAddress(
              fixture.accountAddress,
            );
            document.getElementById('reward-label').textContent = rewardAmount
              ? rewardAmount + ' ' + rewardSymbol
              : rewardSymbol;
            button.textContent = dapp.ctaLabel || 'Claim';
            button.disabled = false;
            document.querySelector('main').style.visibility = 'visible';
            var pendingAssets = 2;
            function waitForImage(img, done) {
              if (!img || img.complete) {
                done();
                return;
              }
              img.addEventListener('load', done, { once: true });
              img.addEventListener('error', done, { once: true });
            }
            function finishAsset() {
              pendingAssets -= 1;
              if (pendingAssets <= 0) {
                assetsReady = true;
                tryPrepare();
              }
            }
            waitForImage(document.getElementById('token-icon'), finishAsset);
            waitForImage(document.getElementById('brand-icon'), finishAsset);
          })
          .catch(function (error) {
            showError(error && error.message ? error.message : 'Failed to load.');
          });
      })();
    </script>
  </body>
</html>
